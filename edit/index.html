<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src https://processzero-content-api.aryammanbhatia.chatgpt.site; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Edit Aryamman Bhatia’s portfolio</title>
<link rel="stylesheet" href="/assets/portfolio.css?v=1">
<link rel="stylesheet" href="/assets/quill.bubble.css">
<link rel="stylesheet" href="/assets/portfolio-editor.css?v=1">
<script src="/assets/purify.min.js" defer></script>
<script src="/assets/quill.js" defer></script>
<script src="/assets/portfolio-shared.js?v=1" defer></script>
<script src="/assets/portfolio-editor.js?v=1" defer></script>
</head>
<body>
<main id="unlock-panel">
  <nav class="editor-sites" aria-label="Choose website"><strong>Portfolio</strong><a href="/edit/processzero/">Process Zero</a></nav>
  <h1>Aryamman Bhatia</h1>
  <p>Portfolio editor</p>
  <form id="unlock-form">
    <label for="pin">Enter your PIN</label>
    <div class="unlock-controls"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required aria-describedby="unlock-error"><button id="unlock-button" type="submit">Unlock</button></div>
    <p id="unlock-error" role="alert"></p>
  </form>
  <p><a href="https://aryammanb.github.io/">View the portfolio</a></p>
</main>
<div id="editor-panel" hidden>
  <div class="editor-bar"><button id="save-button" type="button">Save changes</button><span id="save-status" role="status" aria-live="polite"></span><button id="logout-button" type="button">Lock</button><a href="https://aryammanb.github.io/" target="_blank" rel="noopener">View site</a></div>
  <nav class="editor-sites editor-sites-compact" aria-label="Choose website"><strong>Portfolio</strong><a href="/edit/processzero/">Process Zero</a></nav>
  <main>
    <h1 id="site-title" contenteditable="plaintext-only" role="textbox" aria-label="Your name"></h1>
    <div id="body-editor"></div>
    <p class="editor-note">Click text to edit. Select text for formatting and links. Save changes publishes to your portfolio.</p>
  </main>
</div>
<noscript>Enable JavaScript to use the editor.</noscript>
</body>
</html>
